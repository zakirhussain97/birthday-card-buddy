
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>B-Day Roast & Toast</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Fredoka:wght@300..700&family=Quicksand:wght@300..700&family=Bungee+Shade&family=Caveat:wght@400..700&display=swap');
    
    body {
      font-family: 'Quicksand', sans-serif;
      background-color: #4f46e5;
      background-image: radial-gradient(#ffffff22 2px, transparent 2px);
      background-size: 32px 32px;
    }

    .font-fredoka { font-family: 'Fredoka', sans-serif; }
    .font-caveat { font-family: 'Caveat', cursive; }
    .font-bungee { font-family: 'Bungee Shade', cursive; }

    .confetti-piece {
      position: absolute;
      width: 10px;
      height: 10px;
      top: 0;
      opacity: 0;
      animation: confetti 5s ease-out infinite;
      border-radius: 50%;
    }

    @keyframes confetti {
      0% { opacity: 1; top: -10%; transform: translateX(0) rotate(0); }
      100% { opacity: 0; top: 100%; transform: translateX(100px) rotate(360deg); }
    }

    .floating {
      animation: float 6s ease-in-out infinite;
    }

    @keyframes float {
      0%, 100% { transform: translateY(0) rotate(0); }
      50% { transform: translateY(-20px) rotate(5deg); }
    }

    .title-shimmer {
      background: linear-gradient(
        to right,
        #facc15 20%,
        #fb923c 40%,
        #f472b6 60%,
        #fb923c 80%,
        #facc15 100%
      );
      background-size: 200% auto;
      color: transparent;
      -webkit-background-clip: text;
      background-clip: text;
      animation: shine 3s linear infinite;
    }

    @keyframes shine {
      to { background-position: 200% center; }
    }

    .card-interior {
      background: #fffcf5;
      box-shadow: 
        inset 0 0 100px rgba(0,0,0,0.02),
        0 10px 30px rgba(0,0,0,0.1);
      border: 1px solid #e5e7eb;
      position: relative;
    }

    .card-interior::before {
      content: "";
      position: absolute;
      left: 0;
      top: 0;
      bottom: 0;
      width: 40px;
      background: linear-gradient(to right, rgba(0,0,0,0.05), transparent);
      pointer-events: none;
    }
  </style>
<script type="importmap">
{
  "imports": {
    "@google/genai": "https://esm.sh/@google/genai@^1.40.0",
    "react-dom/": "https://esm.sh/react-dom@^19.2.4/",
    "react/": "https://esm.sh/react@^19.2.4/",
    "react": "https://esm.sh/react@^19.2.4"
  }
}
</script>
<link rel="stylesheet" href="/index.css">
</head>
<body class="bg-indigo-600 overflow-x-hidden">
  <div id="root"></div>
<script type="module" src="/index.tsx"></script>
</body>
</html>
